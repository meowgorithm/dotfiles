[wallpaper]
directory = "/home/christian/Downloads"
fill_mode = "span"

[wallpaper.default]
path = "/home/christian/.config/noctalia/pepper.png"

[wallpaper.last]
path = "/home/christian/.config/noctalia/pepper.png"

[wallpaper.monitors.DP-1]
path = "/home/christian/.config/noctalia/pepper.png"

[wallpaper.monitors.DP-3]
path = "/home/christian/.config/noctalia/pepper.png"

[wallpaper.monitors.eDP-1]
path = "/home/christian/.config/noctalia/pepper.png"

[bar.default]
position = "left"
end = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "theme_toggle", "control-center", "session"]

[widget.theme_toggle]
type = "custom_button"
glyph = "sun-moon"
tooltip = "Toggle light and dark mode"

[widget.theme_toggle.actions]
left = "theme-mode-toggle"

[shell.shadow]
alpha = 0.55

[widget.workspaces]
focused_color = "#BFBCC8"
occupied_color = "#858392"
empty_color = "#605F6B"

[idle]
behavior_order = ["lock", "screen-off"]

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true

[theme]
custom_palette = "Charmtone"
source = "custom"

[theme.templates.user.wallpaper_mode]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/firefox/userChrome.css"
output_path = "$XDG_CACHE_HOME/noctalia/wallpaper-mode.css"
post_hook = "if [ '{{ mode }}' = light ]; then wallpaper='color:#F7F6FB'; else wallpaper=\"$XDG_CONFIG_HOME/noctalia/pepper.png\"; fi; if [ \"$(noctalia msg wallpaper-get)\" != \"$wallpaper\" ]; then noctalia msg wallpaper-set \"$wallpaper\"; fi"

[theme.templates.user.firefox_chrome]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/firefox/userChrome.css"
output_path = "$XDG_CACHE_HOME/noctalia/firefox/userChrome.css"
post_hook = "bash '{{ config_dir }}/templates/firefox/apply.sh'"

[theme.templates.user.firefox_content]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/firefox/userContent.css"
output_path = "$XDG_CACHE_HOME/noctalia/firefox/userContent.css"
post_hook = "bash '{{ config_dir }}/templates/firefox/apply.sh'"

[theme.templates.user.thunar_gtk]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/thunar/gtk.css"
output_path = "$XDG_CACHE_HOME/noctalia/thunar/gtk.css"
post_hook = "bash '{{ config_dir }}/templates/thunar/apply.sh'"
